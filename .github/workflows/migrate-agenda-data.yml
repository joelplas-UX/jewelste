name: "Eenmalig: agenda-data naar nieuwe map"

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Haal huidige agenda op en upload naar agenda-data/
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
        run: |
          set -euo pipefail
          curl -fsS https://jewelste.nl/data/events.json -o events.json
          python3 -c "import json; print(len(json.load(open('events.json'))['events']), 'events')"
          BASE="${FTP_PATH%/}"
          curl -fsS --ftp-create-dirs --user "$FTP_USER:$FTP_PASSWORD" \
            -T events.json "ftp://$FTP_HOST/${BASE#/}/agenda-data/events.json"
          echo "Geupload naar ${BASE#/}/agenda-data/events.json"
