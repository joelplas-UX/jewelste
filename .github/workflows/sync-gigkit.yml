name: Sync Gigkit Events

on:
  schedule:
    # Elke dag om 06:00 UTC (07:00 CET)
    - cron: '0 6 * * *'
  workflow_dispatch: # Ook handmatig triggerbaar

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download published status from live site
        run: |
          mkdir -p data
          curl -s https://jewelste.nl/data/events.json -o data/events.json || echo "{\"events\":[]}" > data/events.json

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Run Gigkit sync
        run: php admin/sync-gigkit.php

      - name: Deploy to Vimexx via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./data/
          server-dir: ${{ secrets.FTP_PATH }}/data/
          dangerous-clean-slate: false
          exclude: |
            .git*
            node_modules/**
            venv/
            .env
