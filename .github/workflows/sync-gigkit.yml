name: Sync Gigkit Events

on:
  schedule:
    # Elke dag om 06:00 UTC (07:00 CET)
    - cron: '0 6 * * *'
  workflow_dispatch: # Ook handmatig triggerbaar

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Run Gigkit sync
        run: php admin/sync-gigkit.php

      - name: Commit and push changes
        run: |
          git config --local user.email "bot@jewelste.nl"
          git config --local user.name "jeWelste Bot"
          git add data/events.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: sync Gigkit events [skip ci]"
            git push origin main
          fi
